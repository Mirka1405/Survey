<h2>Роли зрелого HR: кто ты бизнесу?</h2>
Этот опрос помогает понять, какую роль HR-функция реально играет в бизнесе сейчас: где она влияет на результат, а где остаётся на уровне процессов или поддержки.<br>
<br>
Чем выше оценка, тем более регулярно, системно и с большим влиянием это проявляется. <br>
